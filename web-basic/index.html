<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AirTip Basic Demo</title>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <h1>AirTip Basic Demo</h1>
  <button id="connectBtn">Connect to Device</button><br><br>
  <label>通道选择:
    <select id="channelSelect">
      <option value="0">拇指-指腹</option>
      <option value="1">拇指-桡侧</option>
      <option value="2">拇指-尺侧</option>
      <option value="3">食指-指腹</option>
      <option value="4">食指-桡侧</option>
      <option value="5">食指-尺侧</option>
      <option value="6">中指-指腹</option>
      <option value="7">中指-桡侧</option>
      <option value="8">中指-尺侧</option>
      <option value="9">无名指-指腹</option>
      <option value="10">无名指-桡侧</option>
      <option value="11">无名指-尺侧</option>
      <option value="12">小指-指腹</option>
      <option value="13">小指-桡侧</option>
      <option value="14">小指-尺侧</option>
    </select>
  </label><br><br>
  <label>强度:
    <input type="range" id="intensitySlider" min="0" max="255" value="0">
  </label><br><br>
  <button id="sendBtn">Send</button>
  <button id="resetBtn">Reset</button>
  <canvas id="sceneCanvas" width="600" height="400" style="border:1px solid black"></canvas>
</body>
</html>
