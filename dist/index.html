<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>气动触觉执行器 Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .dot.connected { background: #4f4; }
    .dot.error { background: #f44; }

    #serial-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      padding: 8px 16px;
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    #serial-btn:hover { background: #444; }

    #views-btn {
      position: fixed;
      top: 16px;
      right: 116px;
      z-index: 10;
      padding: 8px 16px;
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    #views-btn:hover { background: #444; }
    #views-btn.active { background: #0a5; border-color: #0c6; }

    /* 三视图象限角标 */
    #views-labels .view-label {
      position: fixed;
      z-index: 11;
      font-size: 12px;
      color: #8af;
      background: rgba(0,0,0,0.5);
      padding: 2px 8px;
      border-radius: 4px;
      pointer-events: none;
    }
    #views-labels .view-label:nth-child(1) { top: 8px;             left: 25%; transform: translateX(-50%); }
    #views-labels .view-label:nth-child(2) { top: 8px;             left: 75%; transform: translateX(-50%); }
    #views-labels .view-label:nth-child(3) { top: calc(50% + 8px); left: 25%; transform: translateX(-50%); }
    #views-labels .view-label:nth-child(4) { top: calc(50% + 8px); left: 75%; transform: translateX(-50%); }

    /* 5×3 气压面板 */
    #pressure-display {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      font-size: 11px;
      font-family: monospace;
      background: rgba(0,0,0,0.6);
      border-radius: 6px;
      padding: 10px;
    }

    #pressure-display .title {
      font-size: 13px;
      margin-bottom: 6px;
      color: #aaa;
    }

    .finger-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
    }

    .finger-label {
      width: 28px;
      text-align: right;
      color: #888;
      flex-shrink: 0;
    }

    .pocket-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 44px;
    }

    .pocket-cell .bar {
      width: 36px;
      height: 8px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }

    .pocket-cell .bar-fill {
      height: 100%;
      width: 0%;
      transition: width 50ms;
    }

    .pocket-cell .val {
      font-size: 9px;
      color: #666;
      margin-top: 1px;
    }

    /* 每个气囊方向用不同颜色区分 */
    .pocket-tip .bar-fill   { background: #0af; }
    .pocket-pad .bar-fill   { background: #f80; }
    .pocket-dorsal .bar-fill { background: #8f0; }
    .pocket-radial .bar-fill { background: #f0a; }
    .pocket-ulnar .bar-fill  { background: #a0f; }

    .pocket-header {
      display: flex;
      gap: 4px;
      margin-left: 32px;
      margin-bottom: 2px;
    }
    .pocket-header span {
      width: 44px;
      text-align: center;
      color: #555;
      font-size: 10px;
    }

    /* 操作指南 */
    #guide {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      font-size: 11px;
      font-family: system-ui, sans-serif;
      background: rgba(0,0,0,0.6);
      border-radius: 6px;
      padding: 10px 14px;
      line-height: 1.7;
      color: #888;
    }

    #guide .guide-title {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }

    #guide kbd {
      display: inline-block;
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 0 4px;
      font-size: 10px;
      font-family: monospace;
      line-height: 1.6;
    }

    #guide .key-row {
      display: flex;
      gap: 6px;
      align-items: baseline;
    }

    #guide .key-label {
      flex-shrink: 0;
      min-width: 80px;
      text-align: right;
      color: #666;
    }

    #guide .guide-sep {
      border-top: 1px solid #333;
      margin: 6px 0;
    }

    #guide .guide-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    #guide .legend-ghost {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: rgba(255, 204, 0, 0.25);
      border: 1px solid rgba(255, 204, 0, 0.5);
    }

    #guide .legend-solid {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ffcc00;
    }

    #guide .legend-exceeded {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ff2222;
    }

    /* 设置面板 */
    #settings-panel {
      position: fixed;
      top: 60px;
      right: 16px;
      z-index: 10;
      width: 260px;
      background: rgba(0,0,0,0.7);
      border-radius: 6px;
      padding: 10px 14px 8px;
      font-size: 11px;
      color: #ccc;
      font-family: system-ui, sans-serif;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .settings-title {
      font-size: 13px;
      color: #aaa;
      font-weight: 600;
    }

    .settings-toggle {
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 3px;
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
    }
    .settings-toggle:hover { background: #444; }

    .setting-row {
      margin-bottom: 8px;
    }

    .setting-label-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .setting-label-line label {
      flex: 1;
      color: #888;
      font-size: 10px;
    }

    .setting-number {
      width: 60px;
      background: #222;
      color: #eee;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 10px;
      font-family: monospace;
      text-align: right;
    }

    .setting-unit {
      color: #555;
      font-size: 9px;
      width: 16px;
      text-align: left;
    }

    .setting-slider {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 2px;
      outline: none;
      margin: 0;
    }
    .setting-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      background: #0af;
      border-radius: 50%;
      cursor: pointer;
    }
    .setting-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: #0af;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    .settings-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }

    .settings-reset {
      background: #333;
      color: #aaa;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 3px 10px;
      font-size: 10px;
      cursor: pointer;
    }
    .settings-reset:hover { background: #444; }

    .setting-row-bool {
      margin-bottom: 4px;
    }

    .setting-bool-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #888;
      font-size: 10px;
    }

    .setting-checkbox {
      width: 12px;
      height: 12px;
      accent-color: #0af;
      cursor: pointer;
    }


  </style>
  <script type="module" crossorigin src="/assets/index-BuMeIdMP.js"></script>
</head>
<body>
  <div id="hud">
    <div class="status-row">
      <span class="dot" id="leap-dot"></span>
      <span id="leap-status">Leap Motion: 未连接</span>
    </div>
    <div class="status-row">
      <span class="dot" id="serial-dot"></span>
      <span id="serial-status">Serial: Mock 模式</span>
    </div>
  </div>

  <button id="views-btn">三视图</button>
  <button id="serial-btn">连接串口</button>


  <div id="pressure-display">
    <div class="title">气压输出 (5×3)</div>
    <div class="pocket-header">
      <span>指腹</span>
      <span>桡侧</span>
      <span>尺侧</span>
    </div>
    <!-- 由 JS 生成 5 行 × 3 列 -->
    <div id="pressure-grid"></div>
  </div>

  <div id="guide">
    <div class="guide-title">操作指南</div>
    <div class="key-row"><span class="key-label"><kbd>左键</kbd> 拖轴</span> 移动手掌</div>
    <div class="key-row"><span class="key-label"><kbd>右键</kbd> 拖拽</span> 旋转视角</div>
    <div class="key-row"><span class="key-label"><kbd>滚轮</kbd></span> 缩放</div>
    <div class="key-row"><span class="key-label"><kbd>Shift</kbd>+<kbd>滚轮</kbd></span> 调节握力（抓取/释放）</div>
    <div class="key-row"><span class="key-label">移动中松握力</span> 抛出（抛物线）</div>
    <div class="guide-sep"></div>
    <div class="guide-legend">
      <span class="legend-ghost"></span> 输入位置（ghost）
    </div>
    <div class="guide-legend">
      <span class="legend-solid"></span> 约束位置（solid）
    </div>
    <div class="guide-legend">
      <span class="legend-exceeded"></span> 超行程（失效 + 高低频告警脉冲）
    </div>
    <div class="guide-sep"></div>
    <div class="key-row"><span class="key-label"><kbd>三视图</kbd></span> 透视/顶/前/侧四象限</div>
    <div class="key-row"><span class="key-label">三视图<kbd>滚轮</kbd></span> 缩放光标所在象限</div>
  </div>

</body>
</html>
